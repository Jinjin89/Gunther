<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Gunther menu bar states</title>
  <desc id="desc">The Gunther mark in the macOS menu bar: calm template states for ready, unsaved, review and preparing; grey mark with a red light while recording, amber bars while paused, and a red badge when capture needs attention. The recording menu shows only the actions that apply.</desc>
  <defs>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
      .serif{font-family:ui-serif,"New York",Georgia,serif}
      .title{font-size:30px;font-weight:500;fill:#1a1a18}
      .lede{font-size:15px;fill:#5f5e5a}
      .label{font-size:14px;font-weight:600;fill:#1a1a18}
      .sub{font-size:12px;fill:#75746f}
      .menu{font-size:13.5px;fill:#1a1a18}
      .menu-dim{font-size:13.5px;fill:#8e8e93}
      .time{font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
    </style>
    <!-- The mark in a 32-unit box: an open ring, a crossbar and a node. -->
    <path id="ring" d="M23.8 8.2A11 11 0 1 0 27 16H18.4" fill="none" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="ring-paused" d="M23.8 8.2A11 11 0 1 0 27 16H21.4" fill="none" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
    <mask id="badge-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32"><rect width="32" height="32" fill="#fff"/><circle cx="27.6" cy="8.4" r="4.8" fill="#000"/></mask>
    <mask id="light-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32"><rect width="32" height="32" fill="#fff"/><circle cx="16" cy="16" r="5.2" fill="#000"/></mask>
    <g id="g-ready"><use href="#ring"/><circle cx="16" cy="16" r="2.8"/></g>
    <g id="g-badge"><g mask="url(#badge-cut)"><use href="#ring"/></g><circle cx="16" cy="16" r="2.8"/><circle cx="27.6" cy="8.4" r="3.3"/></g>
    <g id="g-preparing"><use href="#ring"/><circle cx="16" cy="16" r="2.4" fill="none" stroke-width="1.6"/></g>
    <g id="g-recording"><g mask="url(#light-cut)" stroke="#8e8e93"><use href="#ring"/></g><circle cx="16" cy="16" r="3.9" fill="#ff453a"/></g>
    <g id="g-paused"><g stroke="#8e8e93"><use href="#ring-paused"/></g><rect x="13.35" y="12.9" width="1.9" height="6.2" rx="0.6" fill="#ff9f0a"/><rect x="16.95" y="12.9" width="1.9" height="6.2" rx="0.6" fill="#ff9f0a"/></g>
    <g id="g-attention"><g mask="url(#badge-cut)" stroke="#8e8e93"><use href="#ring"/></g><circle cx="16" cy="16" r="2.8" fill="#8e8e93"/><circle cx="27.6" cy="8.4" r="3.3" fill="#ff453a"/></g>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#141412" flood-opacity=".16"/></filter>
  </defs>

  <rect width="1200" height="760" rx="28" fill="#fafaf8"/>
  <text x="64" y="80" class="serif title">The menu bar shows Gunther, not a record button.</text>
  <text x="64" y="110" class="sans lede">Calm states are template images of the mark. Only live capture changes it — by shape first, colour second — and the timer clears the moment it ends.</text>

  <!-- State cards -->
  <g class="sans">
    <g transform="translate(64 146)">
      <rect width="138" height="170" rx="16" fill="#fff" stroke="#1a1a18" stroke-opacity=".08"/>
      <g transform="translate(37 22) scale(2)" stroke="#1a1a18" fill="#1a1a18"><use href="#g-ready"/></g>
      <text x="18" y="118" class="label">Ready</text><text x="18" y="138" class="sub">the plain mark</text><text x="18" y="156" class="sub">template image</text>
    </g>
    <g transform="translate(216 146)">
      <rect width="138" height="170" rx="16" fill="#fff" stroke="#1a1a18" stroke-opacity=".08"/>
      <g transform="translate(37 22) scale(2)" stroke="#1a1a18" fill="#1a1a18"><use href="#g-badge"/></g>
      <text x="18" y="118" class="label">Unsaved</text><text x="18" y="138" class="sub">badge in the opening</text><text x="18" y="156" class="sub">template image</text>
    </g>
    <g transform="translate(368 146)">
      <rect width="138" height="170" rx="16" fill="#fff" stroke="#1a1a18" stroke-opacity=".08"/>
      <g transform="translate(37 22) scale(2)" stroke="#1a1a18" fill="#1a1a18"><use href="#g-badge"/></g>
      <text x="18" y="118" class="label">Review ready</text><text x="18" y="138" class="sub">same badge, menu says</text><text x="18" y="156" class="sub">“Review Recording…”</text>
    </g>
    <g transform="translate(520 146)">
      <rect width="138" height="170" rx="16" fill="#fff" stroke="#1a1a18" stroke-opacity=".08"/>
      <g transform="translate(37 22) scale(2)" stroke="#1a1a18" fill="#1a1a18"><use href="#g-preparing"/></g>
      <text x="18" y="118" class="label">Preparing</text><text x="18" y="138" class="sub">hollow node while the</text><text x="18" y="156" class="sub">mic opens or it saves</text>
    </g>
    <g transform="translate(672 146)">
      <rect width="138" height="170" rx="16" fill="#fff" stroke="#1a1a18" stroke-opacity=".08"/>
      <g transform="translate(37 22) scale(2)"><use href="#g-recording"/></g>
      <text x="18" y="118" class="label">Recording</text><text x="18" y="138" class="sub">red light + timer</text><text x="18" y="156" class="sub">mark steps back to grey</text>
    </g>
    <g transform="translate(824 146)">
      <rect width="138" height="170" rx="16" fill="#fff" stroke="#1a1a18" stroke-opacity=".08"/>
      <g transform="translate(37 22) scale(2)"><use href="#g-paused"/></g>
      <text x="18" y="118" class="label">Paused</text><text x="18" y="138" class="sub">amber pause bars</text><text x="18" y="156" class="sub">+ timer</text>
    </g>
    <g transform="translate(976 146)">
      <rect width="160" height="170" rx="16" fill="#fff" stroke="#1a1a18" stroke-opacity=".08"/>
      <g transform="translate(48 22) scale(2)"><use href="#g-attention"/></g>
      <text x="18" y="118" class="label">Needs attention</text><text x="18" y="138" class="sub">red badge, e.g. the</text><text x="18" y="156" class="sub">microphone was denied</text>
    </g>
  </g>

  <!-- Menu bar strips -->
  <g class="sans">
    <text x="64" y="370" class="sub">Light menu bar</text>
    <rect x="64" y="380" width="520" height="30" rx="8" fill="#ececec"/>
    <g transform="translate(84 386) scale(0.5625)" stroke="#1a1a18" fill="#1a1a18"><use href="#g-ready"/></g>
    <g transform="translate(150 386) scale(0.5625)" stroke="#1a1a18" fill="#1a1a18"><use href="#g-badge"/></g>
    <g transform="translate(216 386) scale(0.5625)"><use href="#g-recording"/></g><text x="238" y="400" class="time" fill="#1a1a18">12:48</text>
    <g transform="translate(316 386) scale(0.5625)"><use href="#g-paused"/></g><text x="338" y="400" class="time" fill="#1a1a18">12:48</text>
    <g transform="translate(416 386) scale(0.5625)" stroke="#1a1a18" fill="#1a1a18"><use href="#g-preparing"/></g>

    <text x="616" y="370" class="sub">Dark menu bar</text>
    <rect x="616" y="380" width="520" height="30" rx="8" fill="#2a2a2c"/>
    <g transform="translate(636 386) scale(0.5625)" stroke="#f2f2f7" fill="#f2f2f7"><use href="#g-ready"/></g>
    <g transform="translate(702 386) scale(0.5625)" stroke="#f2f2f7" fill="#f2f2f7"><use href="#g-badge"/></g>
    <g transform="translate(768 386) scale(0.5625)"><use href="#g-recording"/></g><text x="790" y="400" class="time" fill="#f2f2f7">12:48</text>
    <g transform="translate(868 386) scale(0.5625)"><use href="#g-paused"/></g><text x="890" y="400" class="time" fill="#f2f2f7">12:48</text>
    <g transform="translate(968 386) scale(0.5625)" stroke="#f2f2f7" fill="#f2f2f7"><use href="#g-preparing"/></g>
  </g>

  <!-- Menus -->
  <g class="sans">
    <text x="64" y="466" class="label">Ready</text>
    <g transform="translate(64 480)" filter="url(#shadow)">
      <rect width="300" height="214" rx="12" fill="#fff" stroke="#1a1a18" stroke-opacity=".1"/>
      <text x="20" y="32" class="menu">Capture…</text>
      <text x="20" y="60" class="menu">New Recording</text>
      <line x1="12" x2="288" y1="76" y2="76" stroke="#1a1a18" stroke-opacity=".1"/>
      <text x="20" y="102" class="menu">Search Gunther…</text>
      <text x="20" y="130" class="menu">Open Gunther</text>
      <line x1="12" x2="288" y1="146" y2="146" stroke="#1a1a18" stroke-opacity=".1"/>
      <text x="20" y="172" class="menu">Quit Gunther</text>
      <text x="20" y="200" class="sub">No recording controls until something records.</text>
    </g>

    <text x="420" y="466" class="label">Recording</text>
    <g transform="translate(420 480)" filter="url(#shadow)">
      <rect width="330" height="258" rx="12" fill="#fff" stroke="#1a1a18" stroke-opacity=".1"/>
      <circle cx="26" cy="27" r="4.5" fill="#ff453a"/>
      <text x="38" y="32" class="menu-dim">Recording · 12:48 — Lecture 7</text>
      <line x1="12" x2="318" y1="48" y2="48" stroke="#1a1a18" stroke-opacity=".1"/>
      <text x="20" y="74" class="menu">Pause Recording</text>
      <text x="20" y="102" class="menu">Mark Moment</text>
      <text x="20" y="130" class="menu">Finish Recording…</text>
      <line x1="12" x2="318" y1="146" y2="146" stroke="#1a1a18" stroke-opacity=".1"/>
      <text x="20" y="172" class="menu">Show Recorder</text>
      <text x="20" y="200" class="menu">Open Gunther</text>
      <line x1="12" x2="318" y1="216" y2="216" stroke="#1a1a18" stroke-opacity=".1"/>
      <text x="20" y="242" class="menu">Quit Gunther…</text>
    </g>

    <g transform="translate(806 466)">
      <text x="0" y="0" class="label">Rules</text>
      <text x="0" y="30" class="sub">• Idle is the brand mark, drawn as a template image.</text>
      <text x="0" y="54" class="sub">• Only live capture leaves the template: red light, amber bars.</text>
      <text x="0" y="78" class="sub">• The timer is cleared with an empty title when capture ends.</text>
      <text x="0" y="102" class="sub">• Menus list only actions that apply right now.</text>
      <text x="0" y="126" class="sub">• “Only while capturing” hides the item when idle.</text>
      <text x="0" y="150" class="sub">• Drawn at 36 px (18 pt @2x) in tray_glyph.rs, no image files.</text>
    </g>
  </g>
</svg>

[project]
name = "gunther-backend"
version = "0.1.2"
description = "Evidence-backed knowledge graph API"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=45.0.0,<50",
  "fastapi>=0.116.0,<1",
  "httpx>=0.28.1,<1",
  "numpy>=2.0,<3",
  "onnxruntime>=1.20,<2",
  "openai>=1.99.0,<3",
  "pypdf>=6.0.0,<7",
  "pydantic-settings>=2.10.0,<3",
  "sqlalchemy>=2.0.43,<3",
  "sqlite-vec>=0.1.9,<0.2",
  "tokenizers>=0.21,<1",
  "uvicorn[standard]>=0.35.0,<1",
  "websockets>=17.0.1,<18",
]

[dependency-groups]
dev = [
  "pyinstaller>=6.16",
  "pytest>=8.4.1,<9",
  "ruff>=0.12.10,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

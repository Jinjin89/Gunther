# Gold material for the quality evaluation (docs/ARTIFACT_QUALITY_GOAL.md section 6).
#
# Each [[set]] is one library: real public pages read through the app's own web capture
# (kind "web"), a PDF turned into text with pdftotext and filed as a note when the capture
# path cannot read the format (kind "pdf-note"), or a folder of notes (kind "notes", set 0 only).
# Every set has a talk deck and a written report. `audience` is student, researcher or
# collaborator (the app calls "researcher" the "scientist" audience).
# Changing anything in a set (sources, question, briefs) seeds that set's library again.

[[set]]
id = "velmora"
title = "Velmora cool roofs (synthetic demo library)"
question = "How well do cool roofs work in Velmora?"
language = "en"
note = "The only synthetic set: the Ask exam's ten demo notes. Fast development loop."
sources = [{ kind = "notes", path = "evals/ask/library" }]

[set.deck]
audience = "collaborator"
use = "talk"
duration = "10-minute talk"
brief = "A 10-minute talk for the city energy committee on what the Velmora cool-roof trial really showed and what the committee should decide."

[set.report]
audience = "collaborator"
brief = "A written briefing for the city energy committee: what the Velmora cool-roof trial found, how far the figures can be trusted, and what to do next."

[[set]]
id = "rag-papers"
title = "Three papers on retrieval-augmented generation"
question = "How do retrieval-augmented generation methods work, and how have they developed?"
language = "en"
sources = [
  { kind = "web", url = "https://ar5iv.labs.arxiv.org/html/2005.11401", title = "Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks (Lewis et al. 2020)" },
  { kind = "web", url = "https://arxiv.org/html/2310.11511", title = "Self-RAG: Learning to Retrieve, Generate, and Critique through Self-Reflection (Asai et al. 2023)" },
  { kind = "web", url = "https://arxiv.org/html/2312.10997", title = "Retrieval-Augmented Generation for Large Language Models: A Survey (Gao et al. 2023)" },
]

[set.deck]
audience = "student"
use = "talk"
duration = "10-minute talk"
brief = "A 10-minute talk for graduate students who know language models but not retrieval: how retrieval-augmented generation works, what Self-RAG changed, and what the survey says is still open."

[set.report]
audience = "researcher"
brief = "A literature briefing for a research group deciding how to build a retrieval-augmented system: what the three papers establish, where they differ, and what remains unresolved."


[package]
name = "gunther-desktop"
version = "0.1.2"
description = "Gunther living knowledge desktop application"
authors = ["Gunther contributors"]
edition = "2021"

[lib]
name = "gunther_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
getrandom = "0.2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "=2.2.0"
tauri-plugin-fs = "2.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
native-smoke = []

[[test]]
name = "native_quit_guard"
path = "tests/native_quit_guard.rs"
harness = false
required-features = ["native-smoke"]

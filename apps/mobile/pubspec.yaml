name: gunther_mobile
description: Gunther mobile knowledge companion for Android and iOS.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  crypto: ^3.0.7
  file_picker: ^12.1.2
  flutter:
    sdk: flutter
  # Pin the latest stable 10.x line. Version 11 currently requires an Android
  # API 37 platform that is not consistently consumable by the stable toolchain.
  flutter_secure_storage: 10.3.1
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  record: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
